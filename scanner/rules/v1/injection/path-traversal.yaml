id: path-traversal
info:
  name: Path Traversal
  severity: high
  category: Path Traversal
  description: The application may be vulnerable to path traversal attacks, allowing attackers to access files outside the web root.

request:
  method: GET
  path: "{{BaseURL}}"
  payloads: path_traversal.txt
  params:
    - file
    - path
    - page
    - doc
    - folder
    - root
    - inc
    - locate
    - show
    - read

matchers:
  type: body-contains-any
  patterns:
    - "root:x:0:0"
    - "daemon:x:1"
    - "[boot loader]"
    - "/bin/bash"
    - "win.ini"
    - "[extensions]"

fix: "Sanitize file path inputs. Use a whitelist of allowed files and directories."
